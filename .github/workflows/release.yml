name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.2.3
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Resolve and validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Resolve existing tag and validate its manifest
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bun run scripts/release.ts resolve "$RELEASE_TAG"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      revision: ${{ needs.prepare.outputs.sha }}
      release-tag: ${{ needs.prepare.outputs.tag }}

  publish:
    name: Publish verified assets
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/download-artifact@v8
        with:
          pattern: llmpk-*
          path: dist
          merge-multiple: true

      - name: Add the installer from the release commit
        run: cp install.sh dist/install.sh

      - name: Verify complete asset inventory and checksums
        run: bun run package:verify

      - name: Confirm tag still identifies the built source
        run: bun run scripts/release.ts verify "$RELEASE_TAG" "$RELEASE_SHA"

      - name: Publish a new release
        run: |
          args=("$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" dist/install.sh dist/*.tar.gz dist/*.tar.gz.sha256
